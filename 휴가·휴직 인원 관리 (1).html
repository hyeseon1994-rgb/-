<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>휴가·휴직 인원 관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f5f9; --surface:#ffffff; --surface-2:#f7f9fc; --line:#e1e7ef; --line-2:#cbd5e1;
  --ink:#0f1b2d; --ink-2:#475569; --ink-3:#8492a6;
  --brand:#1e4fd8; --brand-ink:#ffffff; --brand-soft:#e9effc; --head:#132a4c; --head-ink:#e8eefb; --head-ink-2:#9fb2d4;
  --mat:#6d4bd8; --mat-soft:#efeafd; --par:#1e64d8; --par-soft:#e7effd;
  --sick:#0f8a7e; --sick-soft:#e3f5f2; --ill:#b0640d; --ill-soft:#fbf0e1;
  --warn:#b45309; --warn-soft:#fff6e6; --danger:#c62828; --danger-soft:#fdecec; --ok:#15803d;
  --shadow:0 1px 2px rgba(15,27,45,.06),0 4px 14px rgba(15,27,45,.05);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0b1322; --surface:#121c2e; --surface-2:#17233a; --line:#23314a; --line-2:#33445f;
    --ink:#e4eaf3; --ink-2:#a6b3c7; --ink-3:#6f7f98;
    --brand:#6f9bff; --brand-ink:#0b1322; --brand-soft:#1a2b4f; --head:#0e1a30; --head-ink:#e4eaf3; --head-ink-2:#8798b6;
    --mat:#a68cff; --mat-soft:#251d45; --par:#76a3ff; --par-soft:#182a4d;
    --sick:#4fd1c0; --sick-soft:#123430; --ill:#f0a952; --ill-soft:#35260f;
    --warn:#f0a952; --warn-soft:#33250f; --danger:#ff7b7b; --danger-soft:#3a1717; --ok:#5fd28a;
    --shadow:0 1px 2px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1322; --surface:#121c2e; --surface-2:#17233a; --line:#23314a; --line-2:#33445f;
  --ink:#e4eaf3; --ink-2:#a6b3c7; --ink-3:#6f7f98;
  --brand:#6f9bff; --brand-ink:#0b1322; --brand-soft:#1a2b4f; --head:#0e1a30; --head-ink:#e4eaf3; --head-ink-2:#8798b6;
  --mat:#a68cff; --mat-soft:#251d45; --par:#76a3ff; --par-soft:#182a4d;
  --sick:#4fd1c0; --sick-soft:#123430; --ill:#f0a952; --ill-soft:#35260f;
  --warn:#f0a952; --warn-soft:#33250f; --danger:#ff7b7b; --danger-soft:#3a1717; --ok:#5fd28a;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

.head{background:var(--head);color:var(--head-ink);padding:22px 0 64px}
.wrap{max-width:1280px;margin:0 auto;padding:0 24px}
.head-row{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.title{font-size:22px;font-weight:700;letter-spacing:-.01em;margin:0}
.subtitle{color:var(--head-ink-2);font-size:13px;margin-top:2px}
.head-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sync{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--head-ink-2);padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.06)}
.dot{width:7px;height:7px;border-radius:50%;background:#64748b}
.dot.live{background:#4ade80;box-shadow:0 0 0 3px rgba(74,222,128,.18)}
.dot.local{background:#fbbf24}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:8px;font-weight:500;cursor:pointer;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:var(--surface-2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.excel{background:#1f7a4d;border-color:#1f7a4d;color:#fff}
.btn.excel:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.sm{padding:5px 9px;font-size:12.5px;border-radius:6px}
.btn.danger{color:var(--danger)}
.btn.danger:hover{background:var(--danger-soft);border-color:var(--danger)}
.btn.danger-solid{background:var(--danger);border-color:var(--danger);color:#fff}

.cards{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-top:-44px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px 13px;box-shadow:var(--shadow);text-align:left;cursor:pointer;position:relative;overflow:hidden;transition:border-color .12s,transform .12s}
.card:hover{border-color:var(--line-2)}
.card.on{border-color:var(--c,var(--brand));box-shadow:0 0 0 1px var(--c,var(--brand)),var(--shadow)}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c,var(--brand))}
.card-label{font-size:12.5px;color:var(--ink-2);font-weight:500}
.card-val{font-size:28px;font-weight:700;line-height:1.15;margin-top:4px;letter-spacing:-.02em}
.card-val small{font-size:14px;font-weight:500;color:var(--ink-3);margin-left:2px}
.card-sub{font-size:12px;color:var(--ink-3);margin-top:2px;min-height:18px}
.card.alert{--c:var(--danger)}
.card.alert .card-val{color:var(--danger)}
.ret-list{margin:6px 0 0;padding:0;list-style:none;font-size:12px;color:var(--ink-2)}
.ret-list li{display:flex;justify-content:space-between;gap:6px}
.ret-list b{color:var(--danger);font-weight:600}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);margin-top:18px}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-title{font-size:15.5px;font-weight:600;margin:0;display:flex;align-items:center;gap:8px}
.panel-body{padding:18px}
.tag-edit{font-size:12px;font-weight:500;background:var(--warn-soft);color:var(--warn);padding:2px 8px;border-radius:999px}

.form-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 16px}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f.span2{grid-column:span 2}
.f.span4{grid-column:1/-1}
.f label,.f .lbl{font-size:12.5px;font-weight:500;color:var(--ink-2)}
.req{color:var(--danger);margin-left:2px}
.inp{height:38px;border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:0 11px;width:100%;transition:border-color .12s,box-shadow .12s}
.inp:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.inp.bad{border-color:var(--danger)}
textarea.inp{height:auto;min-height:38px;padding:8px 11px;resize:vertical}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 16px) 16px,calc(100% - 11px) 16px;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}

.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:500;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--sel-soft,var(--brand-soft));border-color:var(--sel,var(--brand));color:var(--sel,var(--brand))}

.date{display:flex;align-items:center;height:38px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);padding:0 4px 0 10px;transition:border-color .12s,box-shadow .12s;position:relative}
.date:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.date.bad{border-color:var(--danger)}
.date input.part{border:0;background:transparent;outline:none;padding:0;text-align:center;font-variant-numeric:tabular-nums}
.date input.y{width:3.4em}.date input.md{width:1.9em}
.date .sep{color:var(--ink-3);padding:0 2px}
.date .cal{margin-left:auto;border:0;background:transparent;color:var(--ink-3);cursor:pointer;width:30px;height:30px;border-radius:6px;display:grid;place-items:center}
.date .cal:hover{background:var(--surface-2);color:var(--ink)}
.date input.native{position:absolute;right:4px;bottom:0;width:30px;height:2px;opacity:0;pointer-events:none;border:0}

.days-box{display:flex;align-items:baseline;gap:6px;height:38px;padding:0 12px;border-radius:8px;background:var(--brand-soft);color:var(--brand)}
.days-box b{font-size:22px;font-weight:700;letter-spacing:-.02em}
.days-box.empty{background:var(--surface-2);color:var(--ink-3)}

.hint{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:9px;font-size:13px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);flex-wrap:wrap}
.hint.info{background:var(--brand-soft);border-color:transparent;color:var(--ink)}
.hint.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.hint.err{background:var(--danger-soft);border-color:transparent;color:var(--danger)}
.hint .grow{flex:1;min-width:200px}
.hint strong{font-weight:600}
.check{display:flex;gap:9px;align-items:flex-start;cursor:pointer;padding:10px 12px;border:1px solid var(--line-2);border-radius:9px;background:var(--surface)}
.check input{width:16px;height:16px;margin-top:2px;accent-color:var(--brand)}
.check.on{border-color:var(--brand);background:var(--brand-soft)}
.check small{display:block;color:var(--ink-3);font-size:12px}
.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}

.tabs{display:flex;gap:2px;background:var(--surface-2);border:1px solid var(--line);padding:3px;border-radius:9px}
.tabs button{border:0;background:transparent;padding:6px 14px;border-radius:7px;cursor:pointer;font-weight:500;color:var(--ink-2)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(15,27,45,.1)}
.tabs .cnt{font-size:12px;color:var(--ink-3);margin-left:4px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line)}
.toolbar .inp{height:34px;width:auto}
.toolbar .search{flex:1;min-width:180px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--brand-soft);color:var(--brand);border-radius:999px;padding:4px 6px 4px 11px;font-size:12.5px;font-weight:500}
.chip button{border:0;background:transparent;color:inherit;cursor:pointer;width:20px;height:20px;border-radius:50%;line-height:1}
.chip button:hover{background:rgba(0,0,0,.08)}

.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:980px}
th{font-size:12px;font-weight:600;color:var(--ink-3);text-align:left;padding:10px 12px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface-2)}
tr.editing td{background:var(--warn-soft)}
.emp-name{font-weight:600}
.emp-sub{font-size:12px;color:var(--ink-3)}
.badge{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap;color:var(--tc);background:var(--ts)}
.t-mat{--tc:var(--mat);--ts:var(--mat-soft)}.t-par{--tc:var(--par);--ts:var(--par-soft)}
.t-sick{--tc:var(--sick);--ts:var(--sick-soft)}.t-ill{--tc:var(--ill);--ts:var(--ill-soft)}
.flag{display:inline-block;font-size:11px;font-weight:600;color:var(--warn);background:var(--warn-soft);padding:1px 7px;border-radius:4px;margin-top:4px}
.flag.ext{color:var(--brand);background:var(--brand-soft)}
.period{white-space:nowrap;font-variant-numeric:tabular-nums}
.period .arrow{color:var(--ink-3);margin:0 4px}
.days{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.days small{font-weight:400;color:var(--ink-3)}

.track{min-width:190px}
.track-bar{height:8px;border-radius:999px;background:var(--line);position:relative;overflow:hidden}
.track-fill{position:absolute;inset:0 auto 0 0;border-radius:999px;background:var(--tc)}
.track-meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;margin-top:5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.st{font-weight:600}
.st.active{color:var(--ink)}.st.soon{color:var(--danger)}.st.upcoming{color:var(--brand)}.st.ended{color:var(--ink-3)}
.note{max-width:220px;color:var(--ink-2);font-size:13px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.actions{display:flex;gap:4px;justify-content:flex-end;white-space:nowrap}

.empty{padding:48px 20px;text-align:center;color:var(--ink-3)}
.empty strong{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.banner{margin-top:14px;padding:10px 14px;border-radius:10px;background:var(--surface);border:1px solid var(--line);color:var(--ink-2);font-size:13px;display:flex;gap:8px;align-items:center}

.modal-bg{position:fixed;inset:0;background:rgba(10,18,32,.45);display:grid;place-items:center;z-index:50;padding:20px}
.modal{background:var(--surface);border-radius:14px;max-width:420px;width:100%;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.25);border:1px solid var(--line)}
.modal h3{margin:0 0 6px;font-size:16.5px}
.modal p{margin:0;color:var(--ink-2)}
.modal .form-actions{margin-top:20px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--head);color:#fff;padding:10px 18px;border-radius:10px;font-size:13.5px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.25)}
tr.clickable{cursor:pointer}
tr.clickable:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
.modal.detail{max-width:620px;max-height:calc(100vh - 40px);display:flex;flex-direction:column}
.detail-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.detail-head h3{font-size:19px;margin:0 0 6px}
.detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 20px;margin:16px 0}
.detail-grid dt{font-size:12px;color:var(--ink-3)}
.detail-grid dd{margin:2px 0 0;font-weight:500}
.detail-note{display:flex;flex-direction:column;min-height:0}
.detail-note .lbl{font-size:12px;color:var(--ink-3);margin-bottom:6px}
.note-body{white-space:pre-wrap;word-break:break-word;line-height:1.7;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:14px 16px;overflow-y:auto;max-height:42vh;min-height:80px}
@media (max-width:560px){.detail-grid{grid-template-columns:1fr}}
.hist{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--surface-2)}
.hist-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.hist-desc{font-size:12px;color:var(--ink-3);margin-top:2px}
.hist-rows{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.hist-row{display:grid;grid-template-columns:40px minmax(0,1fr) 14px minmax(0,1fr) 104px auto;gap:8px;align-items:center}
.hist-no{font-size:12.5px;font-weight:600;color:var(--ink-2);display:flex;flex-direction:column;line-height:1.2}
.hist-no .from{font-size:10.5px;font-weight:500;color:var(--brand)}
.picker{margin-top:12px;border:1px solid var(--brand);border-radius:10px;background:var(--surface);overflow:hidden}
.picker-bar{display:flex;gap:8px;padding:10px;border-bottom:1px solid var(--line)}
.picker-bar .inp{height:34px;flex:1}
.picker-list{max-height:260px;overflow-y:auto}
.picker-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:10px 14px;cursor:pointer}
.picker-item:last-child{border-bottom:0}
.picker-item:hover:not(:disabled){background:var(--brand-soft)}
.picker-item:disabled{cursor:default;opacity:.55}
.pi-main{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pi-emp{color:var(--ink-3);font-size:12.5px}
.pi-period{grid-column:1;font-size:12.5px;color:var(--ink-2)}
.pi-act{grid-column:2;grid-row:1/3;align-self:center;font-size:12.5px;font-weight:600;color:var(--brand)}
.picker-item:disabled .pi-act{color:var(--ink-3)}
.picker-empty{padding:20px 14px;color:var(--ink-3);font-size:13px;text-align:center}
.picker-foot{padding:8px 14px;font-size:12px;color:var(--ink-3);background:var(--surface-2);border-top:1px solid var(--line)}
.sep2{text-align:center;color:var(--ink-3)}
.hist-days{display:flex;align-items:center;gap:6px}
.hist-days .inp{text-align:right}
.hist-days .inp[readonly]{background:var(--surface-2);color:var(--ink-2)}
.sum{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line-2)}
.sum>div{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 12px;min-width:92px}
.sum>div span{font-size:11.5px;color:var(--ink-3)}
.sum b{font-size:16px}
.sum .op{color:var(--ink-3);font-weight:600;font-size:16px}
.sum .tot{border-color:var(--brand);background:var(--brand-soft)}
.sum .tot b{color:var(--brand)}
.sum .lim{margin-left:auto}
.sum .lim.over{border-color:var(--warn);background:var(--warn-soft)}
.sum .lim.over b{color:var(--warn)}
.days-sub{font-size:11.5px;font-weight:400;color:var(--ink-3);line-height:1.45;margin-top:3px}
.days-sub b{color:var(--brand)}
.modal.detail{overflow-y:auto}
.hist-list{margin:0 0 14px;padding:0;list-style:none;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.hist-list li{display:flex;justify-content:space-between;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.hist-list li:last-child{border-bottom:0}
.hist-list li.cur{background:var(--brand-soft);color:var(--brand);font-weight:500}
@media (max-width:700px){.hist-row{grid-template-columns:1fr 1fr}.hist-no{grid-column:1/-1}.sep2{display:none}}
.foot{color:var(--ink-3);font-size:12px;padding:20px 0 32px;text-align:center}

@media (max-width:1180px){.cards{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:900px){.form-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.f.span2{grid-column:1/-1}}
@media (max-width:560px){
  .wrap{padding:0 14px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .form-grid{grid-template-columns:1fr}.card-val{font-size:24px}.head{padding-bottom:58px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const { useState, useEffect, useMemo, useRef } = React;
const html = htm.bind(React.createElement);

/* ---------- 상수 ---------- */
const TYPES = ["출산휴가", "육아휴직", "병결휴가", "상병휴직"];
const TKEY = { "출산휴가": "mat", "육아휴직": "par", "병결휴가": "sick", "상병휴직": "ill" };
const TCOLOR = { "출산휴가": "var(--mat)", "육아휴직": "var(--par)", "병결휴가": "var(--sick)", "상병휴직": "var(--ill)" };
const TSOFT = { "출산휴가": "var(--mat-soft)", "육아휴직": "var(--par-soft)", "병결휴가": "var(--sick-soft)", "상병휴직": "var(--ill-soft)" };
const BIRTH = {
  single: { label: "단태아", days: 90 },
  premature: { label: "미숙아", days: 100 },
  multi: { label: "다태아", days: 120 },
};
const RANKS = ["CL1", "CL2(M)", "CL2(H)", "CL3(M)", "CL3(H)", "S1", "S2", "E1", "E2", "D2", "A", "기타"];
const COLL = "leaves";
const PRIV = "private"; // 자녀 주민번호 전체값: 관리자만 읽기/쓰기 가능한 경로
const fmtRrn = (v) => { const d = (v || "").replace(/\D/g, "").slice(0, 13); return d.length > 6 ? d.slice(0, 6) + "-" + d.slice(6) : d; };
const maskRrn = (v) => { const d = (v || "").replace(/\D/g, ""); if (!d) return ""; return d.length > 6 ? d.slice(0, 6) + "-*******" : d.slice(0, 6); };

/* ---------- 날짜 유틸 (UTC 기준으로 시간대 오차 방지) ---------- */
const pad = (n) => String(n).padStart(2, "0");
const toD = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(Date.UTC(y, m - 1, d)); };
const fmt = (d) => `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`;
const addDays = (s, n) => { const d = toD(s); d.setUTCDate(d.getUTCDate() + n); return fmt(d); };
const addMonths = (s, n) => {
  const d = toD(s), day = d.getUTCDate();
  d.setUTCDate(1); d.setUTCMonth(d.getUTCMonth() + n);
  const last = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 0)).getUTCDate();
  d.setUTCDate(Math.min(day, last)); return fmt(d);
};
const diff = (a, b) => Math.round((toD(b) - toD(a)) / 86400000);
const countDays = (s, e) => (s && e && e >= s ? diff(s, e) + 1 : 0);
const todayStr = () => { const n = new Date(); return `${n.getFullYear()}-${pad(n.getMonth() + 1)}-${pad(n.getDate())}`; };
const dotDate = (s) => (s ? s.replace(/-/g, ".") : "");
const sumPast = (h) => (h || []).reduce((a, x) => a + (+x.days || 0), 0);
const limitOf = (type, bt, ext) => type === "육아휴직" ? (ext ? 548 : 365) : type === "출산휴가" ? (BIRTH[bt] || BIRTH.single).days : null;
const maternityEnd = (start, bt, past = 0) => addDays(start, Math.max(1, (BIRTH[bt] || BIRTH.single).days - past) - 1);
const parentalMaxEnd = (start, ext, past = 0) => past > 0 ? addDays(start, (ext ? 548 : 365) - past - 1) : addDays(addMonths(start, ext ? 18 : 12), -1);

function statusOf(r, today) {
  if (today < r.start) return { key: "upcoming", label: `시작 D-${diff(today, r.start)}` };
  if (today > r.end) return { key: "ended", label: "종료" };
  const left = diff(today, r.end);
  return { key: left <= 30 ? "soon" : "active", label: left === 0 ? "오늘 종료" : `복귀 D-${left}` };
}
const totalOf = (r) => (r.days || countDays(r.start, r.end)) + sumPast(r.history);
const isOver = (r) => {
  if (!r.start || !r.end) return false;
  const past = sumPast(r.history);
  if (r.type === "육아휴직") return r.end > parentalMaxEnd(r.start, r.extended, past);
  const L = limitOf(r.type, r.birthType, r.extended);
  return !!(L && totalOf(r) > L);
};

/* ---------- 날짜 입력 (년도 4자리 → 월 → 일 자동 이동) ---------- */
const splitV = (v) => (v ? { y: v.slice(0, 4), m: v.slice(5, 7), d: v.slice(8, 10) } : { y: "", m: "", d: "" });
function composeV({ y, m, d }) {
  if (y.length !== 4 || !m || !d) return "";
  const Y = +y, M = +m, D = +d;
  if (Y < 1900 || M < 1 || M > 12 || D < 1) return "";
  if (D > new Date(Date.UTC(Y, M, 0)).getUTCDate()) return "";
  return `${y}-${pad(M)}-${pad(D)}`;
}
function DateInput({ value, onChange, bad, label }) {
  const [p, setP] = useState(splitV(value));
  const yR = useRef(), mR = useRef(), dR = useRef(), nR = useRef();
  useEffect(() => { if ((value || "") !== composeV(p)) setP(splitV(value)); }, [value]);
  const upd = (np) => { setP(np); onChange(composeV(np)); };
  const digits = (s, n) => s.replace(/\D/g, "").slice(0, n);
  const back = (e, cur, prev) => { if (e.key === "Backspace" && !cur && prev) { e.preventDefault(); prev.current.focus(); } };
  const openPicker = () => { try { nR.current.showPicker(); } catch (_) { nR.current.focus(); nR.current.click(); } };
  return html`
    <div class=${"date" + (bad ? " bad" : "")} role="group" aria-label=${label}>
      <input ref=${yR} class="part y" inputmode="numeric" placeholder="YYYY" aria-label=${label + " 년"} value=${p.y}
        onChange=${(e) => { const y = digits(e.target.value, 4); upd({ ...p, y }); if (y.length === 4) mR.current.focus(); }} />
      <span class="sep">.</span>
      <input ref=${mR} class="part md" inputmode="numeric" placeholder="MM" aria-label=${label + " 월"} value=${p.m}
        onKeyDown=${(e) => back(e, p.m, yR)}
        onChange=${(e) => { const m = digits(e.target.value, 2); upd({ ...p, m }); if (m.length === 2 || (m.length === 1 && +m > 1)) dR.current.focus(); }} />
      <span class="sep">.</span>
      <input ref=${dR} class="part md" inputmode="numeric" placeholder="DD" aria-label=${label + " 일"} value=${p.d}
        onKeyDown=${(e) => back(e, p.d, mR)}
        onChange=${(e) => upd({ ...p, d: digits(e.target.value, 2) })} />
      <button type="button" class="cal" aria-label=${label + " 달력에서 선택"} onClick=${openPicker}>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      </button>
      <input ref=${nR} type="date" class="native" tabindex="-1" aria-hidden="true" value=${value || ""}
        onChange=${(e) => e.target.value && onChange(e.target.value)} />
    </div>`;
}

/* ---------- 입력 폼 ---------- */
const EMPTY = { empNo: "", name: "", dept: "", rank: "", type: "육아휴직", start: "", end: "", note: "", birthType: "single", extended: false, endAuto: false, history: [], childName: "", childRrn: "" };

function applyMaternity(f) {
  if (f.type === "출산휴가" && f.start && (f.endAuto || !f.end)) return { ...f, end: maternityEnd(f.start, f.birthType, sumPast(f.history)), endAuto: true };
  return f;
}

function LeaveForm({ initial, editing, onSave, onCancel, pool = [], privates = {} }) {
  const [f, setF] = useState(initial);
  const [tried, setTried] = useState(false);
  const [pick, setPick] = useState(null); // null = 검색창 닫힘, 문자열 = 검색어
  useEffect(() => { setF(initial); setTried(false); setPick(null); }, [initial]);

  const set = (k, v) => setF((o) => {
    let n = { ...o, [k]: v };
    if (k === "end") n.endAuto = false;
    if (k === "start" || k === "type" || k === "birthType" || k === "history") n = applyMaternity(n);
    return n;
  });

  const days = countDays(f.start, f.end);
  const orderBad = f.start && f.end && f.end < f.start;
  const hist = f.history || [];
  const past = sumPast(hist);
  const total = days + past;
  const limit = limitOf(f.type, f.birthType, f.extended);
  const recEnd = f.type === "출산휴가" && f.start ? maternityEnd(f.start, f.birthType, past) : "";
  const maxEnd = f.type === "육아휴직" && f.start ? parentalMaxEnd(f.start, f.extended, past) : "";
  const newKey = () => "h" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const addHist = () => set("history", [...hist, { key: newKey(), start: "", end: "", days: "" }]);
  const updHist = (i, patch) => set("history", hist.map((h, j) => {
    if (j !== i) return h;
    const n = { ...h, ...patch };
    if (("start" in patch || "end" in patch) && n.start && n.end && n.end >= n.start) n.days = countDays(n.start, n.end);
    return n;
  }));
  const delHist = (i) => set("history", hist.filter((_, j) => j !== i));
  const isAdded = (r) => hist.some((h) => h.src === r.id || (h.start && h.start === r.start && h.end === r.end));
  const importRec = (r) => {
    const add = [];
    const has = (s, e) => !!s && hist.concat(add).some((h) => h.start === s && h.end === e);
    (r.history || []).forEach((h, k) => {
      if (!has(h.start, h.end)) add.push({ key: newKey() + "p" + k, start: h.start || "", end: h.end || "", days: h.days, src: r.id });
    });
    if (!has(r.start, r.end)) add.push({ key: newKey() + "r", start: r.start, end: r.end, days: r.days || countDays(r.start, r.end), src: r.id });
    const merged = [...hist, ...add].sort((a, b) => ((a.start || "9") < (b.start || "9") ? -1 : 1));
    setF((o) => applyMaternity({ ...o, history: merged,
      empNo: o.empNo || r.empNo || "", name: o.name || r.name || "", dept: o.dept || r.dept || "", rank: o.rank || r.rank || "",
      childName: o.childName || r.childName || "", childRrn: o.childRrn || (privates[r.id] || {}).childRrn || "" }));
  };
  const kid = f.type === "출산휴가" || f.type === "육아휴직";
  const rrnBad = kid && f.childRrn && f.childRrn.replace(/\D/g, "").length !== 13;
  const pq = (pick || "").trim().toLowerCase();
  const cands = pick === null ? [] : pool
    .filter((r) => !pq || (r.empNo || "").toLowerCase().includes(pq) || (r.name || "").toLowerCase().includes(pq))
    .sort((a, b) => ((b.type === f.type) - (a.type === f.type)) || (a.start < b.start ? 1 : -1))
    .slice(0, 50);
  const over = maxEnd && f.end && f.end > maxEnd;
  const errs = {
    empNo: !f.empNo.trim(), name: !f.name.trim(), start: !f.start, end: !f.end || orderBad,
  };
  const hasErr = Object.values(errs).some(Boolean);

  const submit = (e) => {
    e.preventDefault(); setTried(true);
    if (hasErr) return;
    onSave(f);
  };

  return html`
    <form onSubmit=${submit} noValidate>
      <div class="form-grid">
        <div class="f">
          <label for="f-emp">사원번호<span class="req">*</span></label>
          <input id="f-emp" class=${"inp num" + (tried && errs.empNo ? " bad" : "")} value=${f.empNo} placeholder="예: 20231045" onChange=${(e) => set("empNo", e.target.value)} />
        </div>
        <div class="f">
          <label for="f-name">성명<span class="req">*</span></label>
          <input id="f-name" class=${"inp" + (tried && errs.name ? " bad" : "")} value=${f.name} placeholder="홍길동" onChange=${(e) => set("name", e.target.value)} />
        </div>
        <div class="f">
          <label for="f-dept">부서</label>
          <input id="f-dept" class="inp" value=${f.dept} placeholder="경영지원팀" onChange=${(e) => set("dept", e.target.value)} />
        </div>
        <div class="f">
          <label for="f-rank">직급</label>
          <select id="f-rank" class="inp" value=${f.rank} onChange=${(e) => set("rank", e.target.value)}>
            <option value="">선택</option>
            ${RANKS.map((r) => html`<option key=${r} value=${r}>${r}</option>`)}
            ${f.rank && !RANKS.includes(f.rank) && html`<option value=${f.rank}>${f.rank} (이전 값)</option>`}
          </select>
        </div>

        <div class="f span4">
          <span class="lbl">구분<span class="req">*</span></span>
          <div class="seg" role="group" aria-label="휴가·휴직 구분">
            ${TYPES.map((t) => html`<button type="button" key=${t} aria-pressed=${f.type === t}
              style=${{ "--sel": TCOLOR[t], "--sel-soft": TSOFT[t] }} onClick=${() => set("type", t)}>${t}</button>`)}
          </div>
        </div>

        <div class="f">
          <span class="lbl">시작일자<span class="req">*</span></span>
          <${DateInput} label="시작일자" value=${f.start} bad=${tried && errs.start} onChange=${(v) => set("start", v)} />
        </div>
        <div class="f">
          <span class="lbl">종료일자<span class="req">*</span></span>
          <${DateInput} label="종료일자" value=${f.end} bad=${(tried && errs.end) || orderBad || over} onChange=${(v) => set("end", v)} />
        </div>
        <div class="f">
          <span class="lbl">사용일수 (종료일 − 시작일 + 1)</span>
          <div class=${"days-box num" + (days ? "" : " empty")} aria-live="polite">
            ${days ? html`<b>${days.toLocaleString()}</b><span>일</span>` : html`<span>날짜를 모두 입력하면 계산됩니다</span>`}
          </div>
        </div>
        <div class="f">
          <span class="lbl">복귀 예정일</span>
          <div class=${"days-box num" + (f.end && !orderBad ? "" : " empty")} style=${{ background: f.end && !orderBad ? "var(--surface-2)" : undefined, color: f.end && !orderBad ? "var(--ink)" : undefined }}>
            ${f.end && !orderBad ? html`<span style=${{ fontWeight: 600 }}>${dotDate(addDays(f.end, 1))}</span>` : html`<span>—</span>`}
          </div>
        </div>

        ${orderBad && html`<div class="f span4"><div class="hint err">종료일자가 시작일자보다 빠릅니다. 날짜를 다시 확인해 주세요.</div></div>`}

        ${f.type === "출산휴가" && html`
          <div class="f span4">
            <span class="lbl">출산 유형</span>
            <div class="seg" role="group" aria-label="출산 유형">
              ${Object.entries(BIRTH).map(([k, b]) => html`<button type="button" key=${k} aria-pressed=${f.birthType === k}
                style=${{ "--sel": "var(--mat)", "--sel-soft": "var(--mat-soft)" }} onClick=${() => set("birthType", k)}>${b.label} ${b.days}일</button>`)}
            </div>
            <div class="hint info" style=${{ marginTop: 8 }}>
              <div class="grow">
                근로기준법상 출산전후휴가는 ${BIRTH[f.birthType].label} 기준 <strong>${BIRTH[f.birthType].days}일</strong>입니다.
                ${recEnd ? html` 시작일 기준 추천 종료일은 <strong class="num">${dotDate(recEnd)}</strong>입니다.` : " 시작일자를 입력하면 종료일을 추천해 드립니다."}
                ${f.birthType !== "single" && html`<br/><span style=${{ color: "var(--ink-2)" }}>출산 후 최소 ${f.birthType === "multi" ? 60 : 45}일 이상이 확보되어야 합니다.</span>`}
              </div>
              ${recEnd && f.end !== recEnd && html`<button type="button" class="btn sm primary" onClick=${() => setF((o) => ({ ...o, end: recEnd, endAuto: true }))}>추천 종료일 적용</button>`}
            </div>
          </div>`}

        ${f.type === "육아휴직" && html`
          <div class="f span4">
            <label class=${"check" + (f.extended ? " on" : "")}>
              <input type="checkbox" checked=${f.extended} onChange=${(e) => set("extended", e.target.checked)} />
              <span>동일 자녀에 대해 부모 모두 3개월 이상 육아휴직 사용
                <small>체크하면 최대 1년 6개월까지 허용됩니다. (미체크 시 최대 1년)</small></span>
            </label>
            ${maxEnd && html`
              <div class=${"hint " + (over ? "warn" : "info")} style=${{ marginTop: 8 }} role=${over ? "alert" : undefined}>
                <div class="grow">
                  ${over
                    ? html`<strong>최대 사용기간을 초과했습니다.</strong> ${f.extended ? "1년 6개월" : "1년"} 기준 종료일은 <strong class="num">${dotDate(maxEnd)}</strong>까지이며, 입력한 기간은 ${countDays(f.start, f.end)}일(허용 ${countDays(f.start, maxEnd)}일)입니다.`
                    : html`${f.extended ? "1년 6개월" : "1년"} 기준 최대 종료일은 <strong class="num">${dotDate(maxEnd)}</strong>(${countDays(f.start, maxEnd)}일)입니다.`}
                </div>
                ${over && html`<button type="button" class="btn sm" onClick=${() => set("end", maxEnd)}>최대 종료일로 맞추기</button>`}
              </div>`}
          </div>`}

        ${kid && html`
          <div class="f">
            <label for="f-cname">자녀 성명</label>
            <input id="f-cname" class="inp" value=${f.childName || ""} placeholder=${f.type === "출산휴가" ? "출생 전이면 비워 두세요" : "자녀 성명"}
              onChange=${(e) => set("childName", e.target.value)} />
          </div>
          <div class="f">
            <label for="f-rrn">자녀 주민등록번호</label>
            <input id="f-rrn" class=${"inp num" + (rrnBad ? " bad" : "")} inputmode="numeric" autocomplete="off" maxlength="14" placeholder="000000-0000000"
              value=${f.childRrn || ""} onChange=${(e) => set("childRrn", fmtRrn(e.target.value))} />
          </div>
          <div class="f span2">
            <div class=${"hint" + (rrnBad ? " warn" : "")} style=${{ height: "100%", alignItems: "center" }}>
              ${rrnBad ? "주민등록번호 13자리를 모두 입력해 주세요."
                : "전체 번호는 관리자만 볼 수 있는 별도 저장소에 보관됩니다. 팀원 화면에는 뒷자리가 *로 표시됩니다."}
            </div>
          </div>`}

        <div class="f span4">
          <div class="hist">
            <div class="hist-head">
              <div>
                <span class="lbl">과거 사용이력</span>
                <div class="hist-desc">같은 자녀(또는 같은 사유)로 나눠 쓴 이전 기간을 입력하면 총 사용일수에 합산됩니다. 날짜를 모르면 일수만 입력해도 됩니다.</div>
              </div>
              <button type="button" class=${"btn sm" + (pick === null ? "" : " primary")} aria-expanded=${pick !== null}
                onClick=${() => setPick(pick === null ? (f.empNo.trim() || f.name.trim()) : null)}>${pick === null ? "+ 이력 추가" : "닫기"}</button>
            </div>
            ${pick !== null && html`<div class="picker">
              <div class="picker-bar">
                <input class="inp" type="search" autoFocus placeholder="사번 또는 성명으로 보관 이력 검색" aria-label="보관 이력 검색"
                  value=${pick} onChange=${(e) => setPick(e.target.value)} />
                <button type="button" class="btn sm" onClick=${() => { addHist(); setPick(null); }}>직접 입력</button>
              </div>
              <div class="picker-list">
                ${pool.length === 0
                  ? html`<div class="picker-empty">보관된 과거 이력이 없습니다. 직접 입력을 이용해 주세요.</div>`
                  : cands.length === 0
                    ? html`<div class="picker-empty">'${pick}'와 일치하는 보관 이력이 없습니다. 검색어를 바꾸거나 직접 입력해 주세요.</div>`
                    : cands.map((r) => {
                        const added = isAdded(r), hp = sumPast(r.history);
                        return html`<button type="button" key=${r.id} class="picker-item" disabled=${added} onClick=${() => importRec(r)}>
                          <span class="pi-main"><b>${r.name}</b><span class="num pi-emp">${r.empNo}</span><span class=${"badge t-" + (TKEY[r.type] || "par")}>${r.type}</span></span>
                          <span class="pi-period num">${dotDate(r.start)} ~ ${dotDate(r.end)}, ${(r.days || countDays(r.start, r.end)).toLocaleString()}일${hp ? ` (이전 이력 ${hp}일 포함)` : ""}${r.childName || r.childRrnMasked ? `, 자녀 ${[r.childName, r.childRrnMasked].filter(Boolean).join(" ")}` : ""}</span>
                          <span class="pi-act">${added ? "추가됨" : "가져오기"}</span>
                        </button>`;
                      })}
              </div>
              <div class="picker-foot">선택한 기록에 저장된 이전 이력도 함께 가져옵니다. 같은 구분의 기록이 위쪽에 표시됩니다.</div>
            </div>`}
            ${hist.length > 0 && html`<div class="hist-rows">${hist.map((h, i) => {
              const auto = !!(h.start && h.end && h.end >= h.start);
              return html`<div class="hist-row" key=${h.key || i}>
                <span class="hist-no num">${i + 1}차${h.src ? html`<small class="from" title="보관 이력에서 가져옴">보관</small>` : null}</span>
                <${DateInput} label=${`${i + 1}차 시작일자`} value=${h.start} onChange=${(v) => updHist(i, { start: v })} />
                <span class="sep2">~</span>
                <${DateInput} label=${`${i + 1}차 종료일자`} value=${h.end} bad=${h.start && h.end && h.end < h.start} onChange=${(v) => updHist(i, { end: v })} />
                <div class="hist-days">
                  <input class="inp num" type="number" min="0" inputmode="numeric" aria-label=${`${i + 1}차 사용일수`} readOnly=${auto}
                    value=${h.days ?? ""} onChange=${(e) => updHist(i, { days: e.target.value.replace(/\D/g, "") })} />
                  <span>일</span>
                </div>
                <button type="button" class="btn sm ghost danger" onClick=${() => delHist(i)}>삭제</button>
              </div>`;
            })}</div>`}
            <div class="sum num" aria-live="polite">
              <div><span>현재 사용</span><b>${days}일</b></div>
              <span class="op">+</span>
              <div><span>과거 사용</span><b>${past}일</b></div>
              <span class="op">=</span>
              <div class="tot"><span>총 사용</span><b>${total.toLocaleString()}일</b></div>
              ${limit && html`<div class=${"lim" + (total > limit ? " over" : "")}>
                <span>법정 한도 ${limit}일</span>
                <b>${total > limit ? `${total - limit}일 초과` : `잔여 ${limit - total}일`}</b>
              </div>`}
            </div>
          </div>
        </div>

        <div class="f span4">
          <label for="f-note">비고</label>
          <textarea id="f-note" class="inp" rows="2" value=${f.note} placeholder="자녀 정보, 진단서 제출 여부 등" onChange=${(e) => set("note", e.target.value)}></textarea>
        </div>
      </div>
      ${tried && hasErr && html`<div class="hint err" style=${{ marginTop: 14 }}>필수 항목(사원번호, 성명, 시작일자, 종료일자)을 확인해 주세요.</div>`}
      <div class="form-actions">
        ${editing ? html`<button type="button" class="btn" onClick=${onCancel}>수정 취소</button>`
                  : html`<button type="button" class="btn ghost" onClick=${() => { setF(EMPTY); setTried(false); }}>초기화</button>`}
        <button type="submit" class="btn primary">${editing ? "수정 저장" : "등록"}</button>
      </div>
    </form>`;
}

/* ---------- 요약 카드 ---------- */
function Cards({ current, today, filter, setFilter }) {
  const st = current.map((r) => ({ r, s: statusOf(r, today) }));
  const by = (t) => st.filter((x) => x.r.type === t);
  const active = (arr) => arr.filter((x) => x.s.key === "active" || x.s.key === "soon").length;
  const upcoming = (arr) => arr.filter((x) => x.s.key === "upcoming").length;
  const returning = st.filter((x) => x.s.key === "soon").sort((a, b) => (a.r.end < b.r.end ? -1 : 1));
  const card = (key, label, val, sub, color, extra) => html`
    <button key=${key} class=${"card" + (filter === key ? " on" : "") + (key === "returning" && val ? " alert" : "")}
      style=${color ? { "--c": color } : undefined} aria-pressed=${filter === key}
      onClick=${() => setFilter(filter === key ? "all" : key)}>
      <div class="card-label">${label}</div>
      <div class="card-val num">${val}<small>명</small></div>
      <div class="card-sub">${sub}</div>
      ${extra}
    </button>`;
  const totalActive = active(st), totalUp = upcoming(st);
  return html`<div class="cards">
    ${card("all", "현재 관리인원", current.length, `휴직 중 ${totalActive}명, 예정 ${totalUp}명`, "var(--brand)")}
    ${["육아휴직", "출산휴가", "상병휴직", "병결휴가"].map((t) => {
      const a = by(t);
      return card(t, t + "자", active(a), upcoming(a) ? `예정 ${upcoming(a)}명 별도` : `등록 ${a.length}명`, TCOLOR[t]);
    })}
    ${card("returning", "복귀 임박 (30일 이내)", returning.length, returning.length ? "" : "해당 인원 없음", "var(--danger)",
      returning.length ? html`<ul class="ret-list">${returning.slice(0, 2).map((x) =>
        html`<li key=${x.r.id}><span>${x.r.name}</span><b class="num">${x.s.label.replace("복귀 ", "")}</b></li>`)}
        ${returning.length > 2 && html`<li><span>외 ${returning.length - 2}명</span></li>`}</ul>` : null)}
  </div>`;
}

/* ---------- 리스트 행 ---------- */
function Row({ r, today, admin, archived, editingId, onOpen, onEdit, onArchive, onRestore, onDelete }) {
  const s = statusOf(r, today);
  const total = r.days || countDays(r.start, r.end);
  const past = sumPast(r.history);
  const used = Math.max(0, Math.min(total, diff(r.start, today) + 1));
  const pct = total ? (used / total) * 100 : 0;
  const tk = TKEY[r.type] || "par";
  return html`
    <tr class=${"clickable" + (editingId === r.id ? " editing" : "")} tabIndex="0" title="클릭하면 상세 정보를 볼 수 있습니다"
      onClick=${() => onOpen(r)} onKeyDown=${(e) => { if (e.key === "Enter") onOpen(r); }}>
      <td class="num">${r.empNo}</td>
      <td><div class="emp-name">${r.name}</div><div class="emp-sub">${[r.dept, r.rank].filter(Boolean).join(" / ") || "—"}</div></td>
      <td>
        <span class=${"badge t-" + tk}>${r.type}</span>
        ${r.type === "출산휴가" && r.birthType && r.birthType !== "single" && html`<div><span class="flag ext">${BIRTH[r.birthType].label}</span></div>`}
        ${r.type === "육아휴직" && r.extended && html`<div><span class="flag ext">1년 6개월 적용</span></div>`}
        ${isOver(r) && html`<div><span class="flag">기간 초과</span></div>`}
      </td>
      <td class="period">${dotDate(r.start)}<span class="arrow">~</span>${dotDate(r.end)}</td>
      <td class="days">${total.toLocaleString()}<small> 일</small>
        ${past > 0 && html`<div class="days-sub">과거 ${past.toLocaleString()}일<br/>총 <b>${(total + past).toLocaleString()}</b>일</div>`}</td>
      <td class=${"track t-" + tk}>
        <div class="track-bar" role="progressbar" aria-valuemin="0" aria-valuemax=${total} aria-valuenow=${used}
          aria-label=${`${total}일 중 ${used}일 경과`}>
          <div class="track-fill" style=${{ width: pct + "%", opacity: s.key === "ended" ? 0.35 : 1 }}></div>
        </div>
        <div class="track-meta">
          <span class=${"st " + s.key}>${s.label}</span>
          <span>${s.key === "upcoming" ? `복귀 ${dotDate(addDays(r.end, 1))}` : `${used}/${total}일`}</span>
        </div>
      </td>
      <td><div class="note" title=${r.note || ""}>${r.note || html`<span style=${{ color: "var(--ink-3)" }}>—</span>`}</div></td>
      ${archived && html`<td class="num" style=${{ whiteSpace: "nowrap", color: "var(--ink-2)" }}>${dotDate(r.archivedAt)}</td>`}
      ${admin && html`<td onClick=${(e) => e.stopPropagation()} onKeyDown=${(e) => e.stopPropagation()}><div class="actions">
        ${archived
          ? html`<button class="btn sm" onClick=${() => onRestore(r)}>복원</button>
                 <button class="btn sm danger" onClick=${() => onDelete(r)}>삭제</button>`
          : html`<button class="btn sm" onClick=${() => onEdit(r)}>수정</button>
                 <button class="btn sm" onClick=${() => onArchive(r)}>이력보관</button>
                 <button class="btn sm danger" onClick=${() => onDelete(r)}>삭제</button>`}
      </div></td>`}
    </tr>`;
}

/* ---------- 앱 ---------- */
function App() {
  const [records, setRecords] = useState([]);
  const [mode, setMode] = useState("loading"); // loading | live | local
  const [admin, setAdmin] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [formInit, setFormInit] = useState(EMPTY);
  const [tab, setTab] = useState("current");
  const [filter, setFilter] = useState("all");
  const [status, setStatus] = useState("all");
  const [q, setQ] = useState("");
  const [sort, setSort] = useState("start-desc");
  const [confirm, setConfirm] = useState(null);
  const [detailId, setDetailId] = useState(null);
  const detail = detailId ? records.find((x) => x.id === detailId) : null;
  useEffect(() => {
    if (!detailId) return;
    const k = (e) => { if (e.key === "Escape") setDetailId(null); };
    window.addEventListener("keydown", k); return () => window.removeEventListener("keydown", k);
  }, [detailId]);
  const [toast, setToast] = useState("");
  const [privates, setPrivates] = useState({});
  const dbRef = useRef(null), dlRef = useRef(null);
  const today = todayStr();

  const flash = (m) => { setToast(m); clearTimeout(flash.t); flash.t = setTimeout(() => setToast(""), 2600); };

  useEffect(() => {
    let unsub = null, unsubP = null, alive = true;
    (async () => {
      const c = window.claude;
      if (!c || !c.use) { setMode("local"); setAdmin(true); return; }
      const [db, user, dl] = await Promise.all([c.use("db"), c.use("user"), c.use("downloads")]);
      if (!alive) return;
      dlRef.current = dl;
      if (!db) { setMode("local"); setAdmin(true); return; }
      dbRef.current = db;
      let can = null;
      if (user) { try { can = await user.canEdit(); } catch (_) { can = null; } }
      if (!alive) return;
      setAdmin(can === null ? true : can);
      setMode("live");
      unsub = db.collection(COLL).onSnapshot(
        (snap) => setRecords(snap.docs.map((d) => ({ id: d.id, ...d.data() }))),
        (e) => flash("데이터 연결이 끊겼습니다. 페이지를 새로고침해 주세요.")
      );
      if (can !== false) unsubP = db.collection(PRIV).onSnapshot(
        (snap) => { const m = {}; snap.docs.forEach((d) => { m[d.id] = d.data(); }); setPrivates(m); },
        () => {}
      );
    })();
    return () => { alive = false; unsub && unsub(); unsubP && unsubP(); };
  }, []);

  /* 쓰기 */
  const write = async (id, fn, localFn) => {
    if (mode === "live" && dbRef.current) {
      try { await fn(dbRef.current.collection(COLL).doc(id)); return true; }
      catch (e) {
        if (e && e.code === "invalid_argument") { setAdmin(false); flash("편집 권한이 없어 읽기 전용으로 전환했습니다."); }
        else if (e && e.code === "quota_exceeded") flash("저장 공간이 가득 찼습니다. 과거 이력을 일부 삭제해 주세요.");
        else flash("저장하지 못했습니다. 잠시 후 다시 시도해 주세요.");
        return false;
      }
    }
    setRecords(localFn); return true;
  };

  const writePriv = async (id, rrn) => {
    if (rrn === ((privates[id] || {}).childRrn || "")) return;
    if (mode === "live" && dbRef.current) {
      try { const ref = dbRef.current.collection(PRIV).doc(id); if (rrn) await ref.set({ childRrn: rrn }); else await ref.delete(); }
      catch (_) { flash("자녀 주민등록번호를 저장하지 못했습니다."); }
      return;
    }
    setPrivates((p) => { const n = { ...p }; if (rrn) n[id] = { childRrn: rrn }; else delete n[id]; return n; });
  };

  const save = async (f) => {
    const now = new Date().toISOString();
    const prev = editingId ? records.find((r) => r.id === editingId) : null;
    const data = {
      empNo: f.empNo.trim(), name: f.name.trim(), dept: f.dept.trim(), rank: f.rank.trim(),
      type: f.type, start: f.start, end: f.end, days: countDays(f.start, f.end), note: f.note.trim(),
      history: (f.history || []).filter((h) => +h.days > 0).map((h) => ({ key: h.key || "", start: h.start || "", end: h.end || "", days: +h.days, src: h.src || null })),
      childName: (f.type === "출산휴가" || f.type === "육아휴직") ? (f.childName || "").trim() : "",
      childRrnMasked: (f.type === "출산휴가" || f.type === "육아휴직") ? maskRrn(f.childRrn) : "",
      birthType: f.type === "출산휴가" ? f.birthType : null,
      extended: f.type === "육아휴직" ? !!f.extended : false,
      archived: prev ? !!prev.archived : false, archivedAt: prev ? prev.archivedAt || null : null,
      createdAt: prev ? prev.createdAt || now : now, updatedAt: now,
    };
    const id = editingId || "lv" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    const ok = await write(id, (ref) => ref.set(data),
      (rs) => editingId ? rs.map((r) => (r.id === id ? { id, ...data } : r)) : [...rs, { id, ...data }]);
    if (ok) await writePriv(id, (f.type === "출산휴가" || f.type === "육아휴직") ? fmtRrn(f.childRrn || "") : "");
    if (ok) { flash(editingId ? `${data.name}님 정보를 수정했습니다.` : `${data.name}님을 등록했습니다.`); setEditingId(null); setFormInit({ ...EMPTY }); }
  };

  const startEdit = (r) => {
    setEditingId(r.id);
    setFormInit({ ...EMPTY, ...r, birthType: r.birthType || "single", extended: !!r.extended, endAuto: false, note: r.note || "", dept: r.dept || "", rank: r.rank || "", childName: r.childName || "", childRrn: (privates[r.id] || {}).childRrn || "" });
    document.getElementById("form-panel")?.scrollIntoView({ behavior: "smooth", block: "start" });
  };
  const cancelEdit = () => { setEditingId(null); setFormInit({ ...EMPTY }); };

  const archive = (r) => setConfirm({
    title: "이력보관으로 이동할까요?", msg: `${r.name}님(${r.type})을 현재 명단에서 과거 이력으로 옮깁니다. 과거 이력 탭에서 언제든 복원할 수 있습니다.`, ok: "이력보관",
    run: async () => {
      const at = todayStr();
      if (await write(r.id, (ref) => ref.update({ archived: true, archivedAt: at }), (rs) => rs.map((x) => (x.id === r.id ? { ...x, archived: true, archivedAt: at } : x)))) {
        if (editingId === r.id) cancelEdit(); flash(`${r.name}님을 과거 이력으로 보관했습니다.`);
      }
    },
  });
  const archiveEnded = (list) => setConfirm({
    title: `종료된 ${list.length}명을 이력보관할까요?`, msg: "휴가·휴직 기간이 끝난 인원을 모두 과거 이력으로 옮깁니다.", ok: "일괄 보관",
    run: async () => {
      const at = todayStr(); let n = 0;
      for (const r of list) { if (await write(r.id, (ref) => ref.update({ archived: true, archivedAt: at }), (rs) => rs.map((x) => (x.id === r.id ? { ...x, archived: true, archivedAt: at } : x)))) n++; }
      flash(`${n}명을 과거 이력으로 보관했습니다.`);
    },
  });
  const restore = async (r) => {
    if (await write(r.id, (ref) => ref.update({ archived: false, archivedAt: null }), (rs) => rs.map((x) => (x.id === r.id ? { ...x, archived: false, archivedAt: null } : x))))
      flash(`${r.name}님을 현재 명단으로 복원했습니다.`);
  };
  const remove = (r) => setConfirm({
    title: "기록을 삭제할까요?", msg: `${r.name}님(${r.type}, ${dotDate(r.start)} ~ ${dotDate(r.end)}) 기록이 영구 삭제됩니다. 기록을 남기려면 이력보관을 이용해 주세요.`, ok: "삭제", danger: true,
    run: async () => {
      if (await write(r.id, (ref) => ref.delete(), (rs) => rs.filter((x) => x.id !== r.id))) { await writePriv(r.id, ""); if (editingId === r.id) cancelEdit(); flash("삭제했습니다."); }
    },
  });

  /* 파생 데이터 */
  const rrnFor = (r) => (admin && (privates[r.id] || {}).childRrn) || r.childRrnMasked || "";
  const current = useMemo(() => records.filter((r) => !r.archived && r.start && r.end), [records]);
  const archivedList = useMemo(() => records.filter((r) => r.archived), [records]);
  const endedCurrent = current.filter((r) => r.end < today);

  const shown = useMemo(() => {
    let list = tab === "current" ? current : archivedList;
    if (tab === "current") {
      if (filter === "returning") list = list.filter((r) => statusOf(r, today).key === "soon");
      else if (TYPES.includes(filter)) list = list.filter((r) => r.type === filter);
      if (status !== "all") list = list.filter((r) => { const k = statusOf(r, today).key; return status === "active" ? k === "active" || k === "soon" : k === status; });
    } else if (TYPES.includes(filter)) list = list.filter((r) => r.type === filter);
    const t = q.trim().toLowerCase();
    if (t) list = list.filter((r) => [r.empNo, r.name, r.dept, r.rank, r.note].some((v) => (v || "").toLowerCase().includes(t)));
    const [k, dir] = sort.split("-");
    const key = k === "name" ? (r) => r.name || "" : k === "end" ? (r) => r.end : (r) => r.start;
    return [...list].sort((a, b) => { const x = key(a), y = key(b); return (x < y ? -1 : x > y ? 1 : 0) * (dir === "desc" ? -1 : 1); });
  }, [tab, current, archivedList, filter, status, q, sort, today]);

  /* 엑셀 */
  const exportXlsx = async () => {
    const map = (r, arch) => {
      const o = {
        "사원번호": r.empNo, "성명": r.name, "부서": r.dept || "", "직급": r.rank || "", "구분": r.type,
        "세부": r.type === "출산휴가" ? BIRTH[r.birthType || "single"].label : r.type === "육아휴직" ? (r.extended ? "1년 6개월 적용" : "1년") : "",
        "자녀성명": r.childName || "", "자녀주민등록번호": rrnFor(r),
        "시작일자": r.start, "종료일자": r.end, "사용일수": r.days || countDays(r.start, r.end), "과거사용일수": sumPast(r.history), "총사용일수": totalOf(r),
        "복귀예정일": addDays(r.end, 1), "상태": statusOf(r, today).label, "비고": r.note || "",
        "과거사용이력": (r.history || []).map((h, i) => `${i + 1}차 ${h.start && h.end ? dotDate(h.start) + "~" + dotDate(h.end) + " " : ""}(${h.days}일)`).join("; "),
      };
      if (arch) o["보관일"] = r.archivedAt || "";
      return o;
    };
    const cols = (arch) => [10, 10, 14, 8, 10, 14, 10, 16, 12, 12, 9, 11, 10, 12, 12, 30, 44].concat(arch ? [12] : []).map((w) => ({ wch: w }));
    const wb = XLSX.utils.book_new();
    const s1 = XLSX.utils.json_to_sheet(current.map((r) => map(r, false)), { header: ["사원번호","성명","부서","직급","구분","세부","자녀성명","자녀주민등록번호","시작일자","종료일자","사용일수","과거사용일수","총사용일수","복귀예정일","상태","비고","과거사용이력"] });
    s1["!cols"] = cols(false);
    const s2 = XLSX.utils.json_to_sheet(archivedList.map((r) => map(r, true)), { header: ["사원번호","성명","부서","직급","구분","세부","자녀성명","자녀주민등록번호","시작일자","종료일자","사용일수","과거사용일수","총사용일수","복귀예정일","상태","비고","과거사용이력","보관일"] });
    s2["!cols"] = cols(true);
    XLSX.utils.book_append_sheet(wb, s1, "관리명단");
    XLSX.utils.book_append_sheet(wb, s2, "과거이력");
    const filename = `휴가휴직_관리명단_${today.replace(/-/g, "")}.xlsx`;
    const dl = dlRef.current;
    if (dl) {
      const buf = XLSX.write(wb, { bookType: "xlsx", type: "array" });
      try { await dl.save({ filename, data: new Blob([buf]) }); flash("엑셀 파일을 저장했습니다."); }
      catch (e) { if (e && e.code !== "declined") flash("이 화면에서는 파일을 저장할 수 없습니다."); }
    } else {
      try { XLSX.writeFile(wb, filename); } catch (_) { flash("이 화면에서는 파일을 저장할 수 없습니다."); }
    }
  };

  const filterLabel = filter === "returning" ? "복귀 임박" : TYPES.includes(filter) ? filter : null;
  const colCount = 7 + (tab === "archive" ? 1 : 0) + (admin ? 1 : 0);

  return html`
    <header class="head">
      <div class="wrap head-row">
        <div>
          <h1 class="title">휴가·휴직 인원 관리</h1>
          <div class="subtitle">출산휴가, 육아휴직, 병결휴가, 상병휴직 대상자의 기간과 사용일수를 관리합니다. 기준일 ${dotDate(today)}</div>
        </div>
        <div class="head-actions">
          <span class="sync">
            <span class=${"dot " + (mode === "live" ? "live" : mode === "local" ? "local" : "")}></span>
            ${mode === "live" ? (admin ? "실시간 동기화 · 관리자" : "실시간 동기화 · 조회 전용") : mode === "local" ? "미리보기 (저장 안 됨)" : "연결 중…"}
          </span>
          <button class="btn excel" onClick=${exportXlsx} disabled=${!records.length}>
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>
            엑셀 다운로드
          </button>
        </div>
      </div>
    </header>

    <main class="wrap">
      <${Cards} current=${current} today=${today} filter=${tab === "current" ? filter : null} setFilter=${(f) => { setTab("current"); setFilter(f); }} />

      ${mode === "local" && html`<div class="banner">미리보기 화면에서는 입력한 내용이 새로고침 시 사라집니다. 게시된 페이지에서 사용하면 팀원에게 실시간으로 공유됩니다.</div>`}

      ${admin && html`
        <section class="panel" id="form-panel">
          <div class="panel-head">
            <h2 class="panel-title">${editingId ? "대상자 정보 수정" : "대상자 등록"}
              ${editingId && html`<span class="tag-edit">수정 중</span>`}</h2>
          </div>
          <div class="panel-body">
            <${LeaveForm} initial=${formInit} editing=${!!editingId} onSave=${save} onCancel=${cancelEdit}
              pool=${archivedList.filter((r) => r.id !== editingId)} privates=${privates} />
          </div>
        </section>`}

      <section class="panel">
        <div class="panel-head">
          <div class="tabs" role="tablist">
            <button role="tab" aria-selected=${tab === "current"} onClick=${() => setTab("current")}>현재 명단<span class="cnt num">${current.length}</span></button>
            <button role="tab" aria-selected=${tab === "archive"} onClick=${() => { setTab("archive"); if (filter === "returning") setFilter("all"); }}>과거 이력<span class="cnt num">${archivedList.length}</span></button>
          </div>
          ${admin && tab === "current" && endedCurrent.length > 0 && html`
            <button class="btn sm" onClick=${() => archiveEnded(endedCurrent)}>종료된 ${endedCurrent.length}명 일괄 이력보관</button>`}
        </div>
        <div class="toolbar">
          <input class="inp search" type="search" placeholder="사원번호, 성명, 부서, 비고 검색" value=${q} onChange=${(e) => setQ(e.target.value)} aria-label="검색" />
          ${tab === "current" && html`
            <select class="inp" value=${status} onChange=${(e) => setStatus(e.target.value)} aria-label="상태">
              <option value="all">전체 상태</option><option value="active">휴직 중</option><option value="upcoming">시작 예정</option><option value="ended">기간 종료</option>
            </select>`}
          <select class="inp" value=${sort} onChange=${(e) => setSort(e.target.value)} aria-label="정렬">
            <option value="start-desc">시작일 최신순</option><option value="start-asc">시작일 오래된순</option>
            <option value="end-asc">종료일 빠른순</option><option value="name-asc">성명순</option>
          </select>
          ${filterLabel && html`<span class="chip">${filterLabel}<button aria-label="필터 해제" onClick=${() => setFilter("all")}>×</button></span>`}
        </div>
        <div class="tbl-wrap">
          <table>
            <thead><tr>
              <th>사원번호</th><th>성명 / 부서·직급</th><th>구분</th><th>기간</th><th>사용일수</th><th>진행 현황</th><th>비고</th>
              ${tab === "archive" && html`<th>보관일</th>`}
              ${admin && html`<th style=${{ textAlign: "right" }}>관리</th>`}
            </tr></thead>
            <tbody>
              ${mode === "loading"
                ? html`<tr><td colspan=${colCount}><div class="empty">데이터를 불러오는 중입니다…</div></td></tr>`
                : shown.length === 0
                  ? html`<tr><td colspan=${colCount}><div class="empty">
                      <strong>${q || filterLabel || status !== "all" ? "조건에 맞는 인원이 없습니다" : tab === "current" ? "등록된 대상자가 없습니다" : "보관된 이력이 없습니다"}</strong>
                      ${q || filterLabel || status !== "all" ? "검색어나 필터를 바꿔 보세요." : tab === "current" ? (admin ? "위 등록 폼에서 첫 대상자를 추가해 주세요." : "관리자가 등록하면 이곳에 바로 표시됩니다.") : "현재 명단에서 이력보관을 누르면 이곳으로 옮겨집니다."}
                    </div></td></tr>`
                  : shown.map((r) => html`<${Row} key=${r.id} r=${r} today=${today} admin=${admin} archived=${tab === "archive"} editingId=${editingId}
                      onOpen=${(x) => setDetailId(x.id)} onEdit=${startEdit} onArchive=${archive} onRestore=${restore} onDelete=${remove} />`)}
            </tbody>
          </table>
        </div>
      </section>
      <div class="foot">사용일수는 시작일과 종료일을 모두 포함해 계산합니다. 법정 기준은 참고용이며 최종 판단은 사내 규정과 관련 법령을 따릅니다.</div>
    </main>

    ${detail && (() => {
      const s = statusOf(detail, today);
      const total = detail.days || countDays(detail.start, detail.end);
      const dpast = sumPast(detail.history);
      const dlimit = limitOf(detail.type, detail.birthType, detail.extended);
      const sub = detail.type === "출산휴가" ? BIRTH[detail.birthType || "single"].label + " " + BIRTH[detail.birthType || "single"].days + "일"
        : detail.type === "육아휴직" ? (detail.extended ? "1년 6개월 적용" : "최대 1년") : "—";
      const items = [
        ["사원번호", detail.empNo], ["부서", detail.dept || "—"], ["직급", detail.rank || "—"], ["세부 구분", sub],
        ...(detail.childName || rrnFor(detail) ? [["자녀 성명", detail.childName || "—"], ["자녀 주민등록번호", rrnFor(detail) || "—"]] : []),
        ["시작일자", dotDate(detail.start)], ["종료일자", dotDate(detail.end)],
        ["현재 사용일수", total.toLocaleString() + "일"], ["과거 사용일수", dpast.toLocaleString() + "일"],
        ["총 사용일수", (total + dpast).toLocaleString() + "일" + (dlimit ? ` (한도 ${dlimit}일)` : "")], ["복귀 예정일", dotDate(addDays(detail.end, 1))],
        ["상태", detail.archived ? "과거 이력 (보관일 " + dotDate(detail.archivedAt) + ")" : s.label],
        ["최종 수정", detail.updatedAt ? dotDate(detail.updatedAt.slice(0, 10)) : "—"],
      ];
      return html`
      <div class="modal-bg" onClick=${(e) => e.target === e.currentTarget && setDetailId(null)}>
        <div class="modal detail" role="dialog" aria-modal="true" aria-labelledby="d-title">
          <div class="detail-head">
            <div>
              <h3 id="d-title">${detail.name}</h3>
              <span class=${"badge t-" + (TKEY[detail.type] || "par")}>${detail.type}</span>
              ${isOver(detail) && html` <span class="flag">기간 초과</span>`}
            </div>
            <button class="btn ghost sm" aria-label="닫기" onClick=${() => setDetailId(null)}>✕</button>
          </div>
          <dl class="detail-grid">
            ${items.map(([k, v]) => html`<div key=${k}><dt>${k}</dt><dd class="num">${v}</dd></div>`)}
          </dl>
          ${(detail.history || []).length > 0 && html`
            <div class="lbl" style=${{ fontSize: 12, color: "var(--ink-3)", marginBottom: 6 }}>과거 사용이력</div>
            <ul class="hist-list">${detail.history.map((h, i) => html`<li key=${h.key || i}>
              <span>${i + 1}차 ${h.start && h.end ? dotDate(h.start) + " ~ " + dotDate(h.end) : "기간 미입력"}</span><b>${h.days}일</b></li>`)}
              <li class="cur"><span>현재 ${dotDate(detail.start)} ~ ${dotDate(detail.end)}</span><b>${total}일</b></li>
            </ul>`}
          <div class="detail-note">
            <div class="lbl">비고</div>
            <div class="note-body">${detail.note || html`<span style=${{ color: "var(--ink-3)" }}>작성된 메모가 없습니다.</span>`}</div>
          </div>
          <div class="form-actions">
            ${admin && !detail.archived && html`<button class="btn" onClick=${() => { setDetailId(null); startEdit(detail); }}>수정</button>`}
            <button class="btn primary" autoFocus onClick=${() => setDetailId(null)}>닫기</button>
          </div>
        </div>
      </div>`;
    })()}
    ${confirm && html`
      <div class="modal-bg" onClick=${(e) => e.target === e.currentTarget && setConfirm(null)}>
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-title">
          <h3 id="m-title">${confirm.title}</h3>
          <p>${confirm.msg}</p>
          <div class="form-actions">
            <button class="btn" onClick=${() => setConfirm(null)}>취소</button>
            <button class=${"btn " + (confirm.danger ? "danger-solid" : "primary")} autoFocus
              onClick=${async () => { const c = confirm; setConfirm(null); await c.run(); }}>${confirm.ok}</button>
          </div>
        </div>
      </div>`}
    ${toast && html`<div class="toast" role="status">${toast}</div>`}
  `;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
</body>
</html>
